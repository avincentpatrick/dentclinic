name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match the development Node major. `npm run verify` is meant to be
      # this workflow, offline — that guarantee is void if the two run different
      # npm majors. It already was: dev is on Node 24 / npm 11, CI pinned 22 /
      # npm 10, and npm 11 prunes wasm32-wasi optional deps from the lock that
      # npm 10 still demands. `npm ci` therefore failed before a single gate ran
      # — invisibly, because Actions had never executed since the lock was
      # written. Bump both together, or not at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Cheap, deterministic checks first — they fail in seconds rather than
      # after the ~90s build.
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Contrast (52 pairs x 360 brand hues x 2 themes)
        run: npm run check:contrast
      - name: Docs / gallery sync
        run: npm run check:docs

      # NOTE: A11Y_AUDIT=1 opens /design-system without a session so axe can
      # reach it. THIS ARTIFACT MUST NEVER BE DEPLOYED. This workflow has no
      # deploy job, and `npm run deploy` refuses to run with the flag set
      # (scripts/assert-no-bypass.mjs). If a deploy job is ever added here,
      # give the a11y run its own build + distDir first.
      # See docs/design-system/06-accessibility.md.
      - name: Build (OpenNext Cloudflare)
        run: npx opennextjs-cloudflare build
        env:
          A11Y_AUDIT: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Route table coverage
        run: npm run check:routes
      - name: Worker size (3 MB free-tier limit)
        run: npm run check:size

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Accessibility (axe + keyboard, desktop + mobile)
        run: npm run test:a11y
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
